<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class 10 Revision Cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one column of index cards under a scrolling deck switcher; large tap targets throughout */
:root {
  --bg: #EEF2F6;
  --card: #FFFFFF;
  --ink: #15212C;
  --muted: #566573;
  --line: #D3DCE4;
  --rule: #E6EDF3;
  --accent: #1F5FBF;
  --accent-soft: #DCE8FA;
  --good: #1D7A4B;
  --good-soft: #DDF2E6;
  --again: #A85A0A;
  --again-soft: #FBEAD6;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151C; --card: #16202A; --ink: #E5ECF2; --muted: #95A3B0; --line: #2A3845; --rule: #1D2833;
    --accent: #79A8F2; --accent-soft: #1C2D47; --good: #5FC28F; --good-soft: #163327; --again: #EBA25A; --again-soft: #3A2814;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151C; --card: #16202A; --ink: #E5ECF2; --muted: #95A3B0; --line: #2A3845; --rule: #1D2833;
  --accent: #79A8F2; --accent-soft: #1C2D47; --good: #5FC28F; --good-soft: #163327; --again: #EBA25A; --again-soft: #3A2814;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 6vw, 36px); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--muted); }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.tab {
  flex: none; border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  font: 700 15px var(--body); padding: 10px 14px; border-radius: 999px; cursor: pointer; min-height: 44px;
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
.tab:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.intro { margin: 0; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
.count b { color: var(--ink); }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--good); width: 0; transition: width .3s; }
.card {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 22px 20px 24px;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
  background-position: 0 52px; min-height: 260px; display: flex; flex-direction: column; gap: 14px;
}
.tag { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 6px; }
.q { font-family: var(--display); font-weight: 600; font-size: clamp(20px, 4.6vw, 25px); line-height: 1.3; margin: 0; text-wrap: balance; }
.a { white-space: pre-line; font-size: 19px; line-height: 1.6; margin: 0; padding-top: 12px; border-top: 2px dashed var(--line); }
.hint { color: var(--muted); font-size: 15px; margin: 0; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  flex: 1 1 140px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink); font: 700 17px var(--body); cursor: pointer; padding: 10px 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.again { background: var(--again-soft); border-color: var(--again); color: var(--again); }
.btn.small { flex: 0 0 auto; min-height: 40px; font-size: 14px; padding: 6px 12px; }
.done { text-align: center; padding: 28px 12px; }
.done h2 { font-family: var(--display); margin: 0 0 6px; font-size: 26px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.row .rq { font-weight: 700; }
.row .ra { white-space: pre-line; color: var(--muted); }
.row.known { border-left: 5px solid var(--good); }
/* Reading drill */
.words { display: flex; flex-wrap: wrap; gap: 6px; font-size: 19px; line-height: 1.4; }
.w { border: 1.5px solid transparent; background: transparent; color: var(--ink); font: inherit; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
.w:hover { border-color: var(--line); }
.w.on { background: var(--accent-soft); border-color: var(--accent); }
.w.hit { background: var(--good-soft); border-color: var(--good); }
.w.miss { border: 2px dashed var(--again); }
.w.extra { opacity: .55; text-decoration: line-through; }
.find { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin: 0; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.lg-hit::before { background: var(--good-soft); border: 1.5px solid var(--good); }
.lg-miss::before { border: 2px dashed var(--again); }
/* Proof order */
.placed, .pool { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.placed li { background: var(--good-soft); border: 1.5px solid var(--good); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; }
.placed li b { color: var(--good); font-variant-numeric: tabular-nums; }
.pool button { text-align: left; width: 100%; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: 400 17px var(--body); padding: 12px 14px; border-radius: 10px; cursor: pointer; min-height: 48px; }
.pool button.wrong { border-color: var(--again); background: var(--again-soft); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .pool button.wrong { animation: none; } .progress span { transition: none; } }
.label { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; }
/* Exam card */
.exam { display: grid; gap: 16px; }
.exam section { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.exam h3 { font-family: var(--display); margin: 0 0 8px; font-size: 20px; }
.exam ol, .exam ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
</style>
</head>

  ]},

/* storage helpers: per-device convenience only */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const tabs = document.getElementById("tabs");
const view = document.getElementById("view");
let current = store.get("rev-tab", "twins");
if (!DECKS.find(d => d.id === current)) current = "twins";

function renderTabs() {
  tabs.innerHTML = "";
  DECKS.forEach(d => {
    const b = el("button", "tab", d.name);
    b.id = "tab-" + d.id; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", d.id === current ? "true" : "false");
    b.onclick = () => { current = d.id; store.set("rev-tab", current); renderTabs(); render(); };
    tabs.appendChild(b);
  });
}

/* ---------- Flashcards ---------- */
const sessions = {};
function flashSession(d, onlyAgain) {
  const known = new Set(store.get("rev-known-" + d.id, []));
  let idx = d.cards.map((_, i) => i);
  if (onlyAgain) idx = idx.filter(i => !known.has(i));
  sessions[d.id] = { queue: shuffle(idx), shown: false, list: false };
}
function renderFlash(d) {
  if (!sessions[d.id]) flashSession(d, false);
  const s = sessions[d.id];
  const known = new Set(store.get("rev-known-" + d.id, []));
  const box = el("div"); box.style.display = "grid"; box.style.gap = "14px";
  box.appendChild(el("p", "intro", d.intro));

  const bar = el("div", "bar");
  const count = el("div", "count");
  count.innerHTML = "<b>" + known.size + "</b> of " + d.cards.length + " known · " + s.queue.length + " left this round";
  bar.appendChild(count);
  const tools = el("div", "btns");
  const listBtn = el("button", "btn small", s.list ? "Back to cards" : "See all");
  listBtn.onclick = () => { s.list = !s.list; render(); };
  const resetBtn = el("button", "btn small", "Reset progress");
  resetBtn.onclick = () => {
    if (resetBtn.dataset.confirm) { store.set("rev-known-" + d.id, []); flashSession(d, false); render(); }
    else { resetBtn.dataset.confirm = "1"; resetBtn.textContent = "Tap again to reset"; }
  };
  tools.append(listBtn, resetBtn);
  bar.appendChild(tools);
  box.appendChild(bar);
  const prog = el("div", "progress"); const fill = el("span"); fill.style.width = (100 * known.size / d.cards.length) + "%"; prog.appendChild(fill); box.appendChild(prog);

  if (s.list) {
    const list = el("div", "list");
    d.cards.forEach((c, i) => {
      const r = el("div", "row" + (known.has(i) ? " known" : ""));
      r.append(el("span", "tag", c[0]), el("div", "rq", c[1]), el("div", "ra", c[2]));
      list.appendChild(r);
    });
    box.appendChild(list);
    return box;
  }

  if (!s.queue.length) {
    const done = el("div", "card done");
    done.appendChild(el("h2", null, "Round finished"));
    const left = d.cards.length - known.size;
    done.appendChild(el("p", "hint", left ? left + " cards still marked Again." : "Every card in this deck is known. Come back in 3 days to check."));
    const b = el("div", "btns");
    const again = el("button", "btn primary", left ? "Practise the Again cards" : "Go through all again");
    again.onclick = () => { flashSession(d, !!left); render(); };
    const all = el("button", "btn", "Whole deck");
    all.onclick = () => { flashSession(d, false); render(); };
    b.append(again, all); done.appendChild(b);
    box.appendChild(done);
    return box;
  }

  const i = s.queue[0]; const c = d.cards[i];
  const card = el("div", "card");
  card.append(el("span", "tag", d.id === "eqns" ? "Equation " + c[0] : c[0]), el("p", "q", c[1]));
  if (!s.shown) {
    card.appendChild(el("p", "hint", d.id === "eqns" ? "Write it on paper first." : "Say the answer out loud first."));
    const b = el("div", "btns"); b.style.marginTop = "auto";
    const show = el("button", "btn primary", "Show answer");
    show.onclick = () => { s.shown = true; render(); };
    b.appendChild(show); card.appendChild(b);
  } else {
    card.appendChild(el("p", "a", c[2]));
    const b = el("div", "btns"); b.style.marginTop = "auto";
    const ag = el("button", "btn again", "Again");
    ag.onclick = () => {
      const k = new Set(store.get("rev-known-" + d.id, [])); k.delete(i); store.set("rev-known-" + d.id, [...k]);
      s.queue.push(s.queue.shift()); s.shown = false; render();
    };
    const ok = el("button", "btn good", "Got it");
    ok.onclick = () => {
      const k = new Set(store.get("rev-known-" + d.id, [])); k.add(i); store.set("rev-known-" + d.id, [...k]);
      s.queue.shift(); s.shown = false; render();
    };
    b.append(ag, ok); card.appendChild(b);
  }
  box.appendChild(card);
  return box;
}

/* ---------- Proof order ---------- */
const orderState = {};
function renderOrder(d) {
  if (!orderState.i) orderState.i = 0;
  const item = d.items[orderState.i];
  if (!orderState.pool || orderState.for !== orderState.i) {
    orderState.for = orderState.i; orderState.placed = 0; orderState.mistakes = 0;
    orderState.pool = shuffle(item.steps.map((_, k) => k));
  }
  const box = el("div"); box.style.display = "grid"; box.style.gap = "14px";
  box.appendChild(el("p", "intro", d.intro));
  const pick = el("div", "btns");
  d.items.forEach((it, k) => {
    const b = el("button", "btn small" + (k === orderState.i ? " primary" : ""), it.title);
    b.onclick = () => { orderState.i = k; orderState.pool = null; render(); };
    pick.appendChild(b);
  });
  box.appendChild(pick);

  const card = el("div", "card");
  card.appendChild(el("p", "q", item.title));
  const placed = el("ol", "placed");
  for (let k = 0; k < orderState.placed; k++) {
    const li = el("li"); li.append(el("b", null, (k + 1) + "."), el("span", null, item.steps[k])); placed.appendChild(li);
  }
  card.appendChild(placed);
  if (orderState.placed < item.steps.length) {
    card.appendChild(el("p", "label", "Tap step " + (orderState.placed + 1)));
    const pool = el("ul", "pool");
    orderState.pool.filter(k => k >= orderState.placed).forEach(k => {
      const li = el("li"); const b = el("button", null, item.steps[k]);
      b.onclick = () => {
        if (k === orderState.placed) { orderState.placed++; render(); }
        else { orderState.mistakes++; b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); }
      };
      li.appendChild(b); pool.appendChild(li);
    });
    card.appendChild(pool);
  } else {
    card.appendChild(el("p", "hint", orderState.mistakes === 0 ? "Complete, with no wrong taps." : "Complete. Wrong taps: " + orderState.mistakes + ". Try it once more."));
    const b = el("div", "btns");
    const again = el("button", "btn", "Try again");
    again.onclick = () => { orderState.pool = null; render(); };
    const next = el("button", "btn primary", "Next proof");
    next.onclick = () => { orderState.i = (orderState.i + 1) % d.items.length; orderState.pool = null; render(); };
    b.append(again, next); card.appendChild(b);
  }
  box.appendChild(card);
  return box;
}

/* ---------- Reading drill ---------- */
const drillState = { i: 0, on: new Set(), checked: false };
function renderDrill(d) {
  const item = d.items[drillState.i];
  const box = el("div"); box.style.display = "grid"; box.style.gap = "14px";
  box.appendChild(el("p", "intro", d.intro));
  const bar = el("div", "bar");
  bar.appendChild(el("div", "count", "Question " + (drillState.i + 1) + " of " + d.items.length));
  box.appendChild(bar);

  const card = el("div", "card");
  const words = el("div", "words");
  const parts = item.text.split(/(\[[^\]]+\])/).filter(Boolean);
  let n = 0;
  parts.forEach(p => {
    const isKey = p.startsWith("[");
    const chunks = isKey ? [p.slice(1, -1)] : p.trim().split(/\s+/).filter(Boolean);
    chunks.forEach(t => {
      const id = n++;
      const b = el("button", "w", t);
      b.type = "button";
      if (drillState.checked) {
        const on = drillState.on.has(id);
        if (isKey && on) b.classList.add("hit");
        else if (isKey) b.classList.add("miss");
        else if (on) b.classList.add("extra");
      } else if (drillState.on.has(id)) b.classList.add("on");
      b.onclick = () => {
        if (drillState.checked) return;
        drillState.on.has(id) ? drillState.on.delete(id) : drillState.on.add(id); render();
      };
      words.appendChild(b);
    });
  });
  card.appendChild(words);
  const btns = el("div", "btns"); btns.style.marginTop = "auto";
  if (!drillState.checked) {
    const chk = el("button", "btn primary", "Check");
    chk.onclick = () => { drillState.checked = true; render(); };
    btns.appendChild(chk);
  } else {
    const lg = el("div", "legend");
    lg.append(el("span", "lg-hit", "Found"), el("span", "lg-miss", "Missed"));
    card.appendChild(lg);
    card.appendChild(el("p", "find", item.find));
    const next = el("button", "btn primary", drillState.i + 1 < d.items.length ? "Next question" : "Start over");
    next.onclick = () => { drillState.i = (drillState.i + 1) % d.items.length; drillState.on = new Set(); drillState.checked = false; render(); };
    const retry = el("button", "btn", "Try this one again");
    retry.onclick = () => { drillState.on = new Set(); drillState.checked = false; render(); };
    btns.append(retry, next);
  }
  card.appendChild(btns);
  box.appendChild(card);
  return box;
}

/* ---------- Exam card ---------- */
function renderExam() {
  const box = el("div", "exam");
  box.innerHTML = `
  <p class="intro">Read this before every practice paper, and on the morning of the exam.</p>
  <section><h3>Before each question</h3><ol>
    <li>Circle the small words that change the question: <b>not</b>, <b>distinct</b>, <b>equal</b>, <b>three</b>, <b>from now</b>, <b>mirror</b> or <b>lens</b>.</li>
    <li>Write one line: <b>Find: ___</b></li></ol></section>
  <section><h3>While answering</h3><ul>
    <li>MCQ: write the letter <b>and</b> the answer, like “(b) −10”.</li>
    <li>Assertion–Reason: Is A true? Is R true? Read “A, because R”. Does it make sense?</li>
    <li>One step per line. Leave a blank line between steps.</li>
    <li>Box the final answer. Add the unit.</li>
    <li>Science long answers: a labelled diagram or a flow chart, plus key words.</li></ul></section>
  <section><h3>After each question</h3><ul>
    <li>Reread the last line of the question. Does my answer match what it asked?</li></ul></section>
  <section><h3>Order</h3><ul>
    <li>Start with the sections you find easiest. Leave proofs for the end.</li>
    <li>Don't leave any question blank. A formula and a first step still earn marks.</li></ul></section>`;
  return box;
}

function render() {
  const d = DECKS.find(x => x.id === current);
  view.innerHTML = "";
  view.appendChild(d.kind === "flash" ? renderFlash(d) : d.kind === "order" ? renderOrder(d) : d.kind === "drill" ? renderDrill(d) : renderExam());
}
renderTabs(); render();
</script>
